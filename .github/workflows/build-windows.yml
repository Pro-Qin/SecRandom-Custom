name: Build Windows

# 特供仓库的唯一构建入口。本机只装 .NET 运行时，构建全部搬到 GitHub Actions。
# 上游的 build_publish.yml / build_ios.yml / codeQL.yml 依赖上游 secrets、macOS 与多平台
# workload，在特供仓库里注定失败，已按仓库既有惯例归档为 *.bak，不再随 push 触发。

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  # 更新清单签名私钥。未配置时只产出手工可用的 zip，跳过清单签名。
  UPDATE_MANIFEST_PRIVATE_KEY_PEM_BASE64: ${{ secrets.UPDATE_MANIFEST_PRIVATE_KEY_PEM_BASE64 }}

jobs:
  build:
    name: Build_win-x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # vendors/EdgeTtsSharp 是子模块，不递归检出会直接 CS2001
          submodules: recursive
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Show SDK info
        shell: pwsh
        run: |
          dotnet --version
          dotnet --list-sdks

      - name: Restore
        shell: pwsh
        run: dotnet restore SecRandom.Desktop/SecRandom.Desktop.csproj -r win-x64 -p:BuildInParallel=false

      - name: Publish
        shell: pwsh
        run: >
          dotnet publish SecRandom.Desktop/SecRandom.Desktop.csproj
          -c Release -r win-x64 --self-contained true
          -p:BuildInParallel=false -p:UseSharedCompilation=false
          -o publish

      - name: Verify publish output
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path publish -Filter *.exe -File
          if (-not $exe) { throw 'publish 目录中没有任何 exe，发布失败' }
          "publish 文件数: $((Get-ChildItem -Path publish -File -Recurse | Measure-Object).Count)"
          $exe | ForEach-Object { "入口: $($_.Name)" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: secrandom-win-x64
          path: publish
          if-no-files-found: error
          retention-days: 14

      - name: Package zip
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $zipName = "SecRandom-$tag-win-x64-portable-full.zip"
          $zipPath = Join-Path $env:RUNNER_TEMP $zipName
          Compress-Archive -Path publish/* -DestinationPath $zipPath -CompressionLevel Optimal
          "ZIP_NAME=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ZIP_PATH=$zipPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "zip: $zipName ($((Get-Item $zipPath).Length) bytes)"

      - name: Generate signed update manifest
        if: startsWith(github.ref, 'refs/tags/v') && env.UPDATE_MANIFEST_PRIVATE_KEY_PEM_BASE64 != ''
        shell: pwsh
        run: |
          $privateKeyPath = Join-Path $env:RUNNER_TEMP 'secrandom-update-ed25519.pem'
          $publicDerPath = Join-Path $env:RUNNER_TEMP 'secrandom-update-ed25519-public.der'
          try {
            [IO.File]::WriteAllBytes($privateKeyPath, [Convert]::FromBase64String(($env:UPDATE_MANIFEST_PRIVATE_KEY_PEM_BASE64 -replace '[^A-Za-z0-9+/=]', '')))
            & openssl pkey -in $privateKeyPath -pubout -outform DER -out $publicDerPath
            if ($LASTEXITCODE -ne 0) { throw "OpenSSL Ed25519 public-key export failed with exit code $LASTEXITCODE." }
            $publicDer = [IO.File]::ReadAllBytes($publicDerPath)
            if ($publicDer.Length -lt 32) { throw 'The update-signing public key is invalid.' }
            $derivedPublicKey = [Convert]::ToBase64String($publicDer[($publicDer.Length - 32)..($publicDer.Length - 1)])
            $embeddedPublicKey = (Get-Content -LiteralPath 'SecRandom/Assets/Updates/release-public-key.txt' -Raw).Trim()
            if ($derivedPublicKey -cne $embeddedPublicKey) {
              throw 'UPDATE_MANIFEST_PRIVATE_KEY_PEM_BASE64 does not match SecRandom/Assets/Updates/release-public-key.txt.'
            }

            $tag = $env:GITHUB_REF_NAME
            $zip = Get-Item -LiteralPath $env:ZIP_PATH
            $artifacts = @(
              [ordered]@{
                id          = 'windows-x64-portable-zip-self-contained'
                os          = 'windows'
                arch        = 'x64'
                kind        = 'portable-zip'
                runtimeKind = 'self-contained'
                assetName   = $env:ZIP_NAME
                byteLength  = $zip.Length
                sha512      = (Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA512).Hash
              }
            )
            $manifest = [ordered]@{
              schemaVersion = 1
              product       = 'SecRandom'
              channel       = 'release'
              tag           = $tag
              version       = $tag.TrimStart('v')
              publishedAt   = [DateTimeOffset]::UtcNow.ToString('O')
              artifacts     = $artifacts
            }
            $manifestPath = Join-Path $env:RUNNER_TEMP 'SecRandom-update-manifest.json'
            $signaturePath = Join-Path $env:RUNNER_TEMP 'SecRandom-update-manifest.sig'
            $manifest | ConvertTo-Json -Depth 5 -Compress | Set-Content -LiteralPath $manifestPath -Encoding utf8NoBOM -NoNewline
            & openssl pkeyutl -sign -rawin -inkey $privateKeyPath -in $manifestPath -out $signaturePath
            if ($LASTEXITCODE -ne 0) { throw "OpenSSL Ed25519 signing failed with exit code $LASTEXITCODE." }
            "MANIFEST_PATH=$manifestPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "SIGNATURE_PATH=$signaturePath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "signed manifest for $tag"
          }
          finally {
            Remove-Item $privateKeyPath -Force -ErrorAction SilentlyContinue
            Remove-Item $publicDerPath -Force -ErrorAction SilentlyContinue
          }

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ZIP_PATH }}
            ${{ env.MANIFEST_PATH }}
            ${{ env.SIGNATURE_PATH }}
          name: SecRandom 特供版 ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Qin_zzq 特供构建 ${{ github.ref_name }}
            更新源：Pro-Qin/SecRandom-Custom
            官方版请前往 https://github.com/SECTL/SecRandom

      - name: Point release metadata at this tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        continue-on-error: true
        run: |
          $tag = $env:GITHUB_REF_NAME
          $path = 'metadata.yaml'
          $content = Get-Content -LiteralPath $path -Raw
          $updated = [regex]::Replace($content, '(?m)^(  release:\r?\n    tag: )\S+$', "${1}$tag")
          if ($updated -ceq $content) { "metadata.yaml 的 release 通道已经指向 $tag"; exit 0 }
          [IO.File]::WriteAllText($path, $updated, [Text.UTF8Encoding]::new($false))
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add $path
          git commit -m "chore: release $tag [skip ci]"
          git push origin HEAD:master
